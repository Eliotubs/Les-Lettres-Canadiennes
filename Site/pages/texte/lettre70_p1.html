<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interface de lecture - Lettres canadiennes</title>
    <link href="../../style/style-general.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    </style>
  </head>
  <body>
    <header>
      <nav class="header-container">
        <p id="logo-title">Les lettres canadiennes</p>
        <ul id="nav">
          <li>
            <a href="template.html">Accueil</a>
          </li>
          <li class="active">
            <button
              id="btn-texte-popover"
              class="btn-menu"
              popovertarget="nav-texte-popover"
            >
              Texte<i class="fa-solid fa-chevron-up"></i>
            </button>
            <div class="popover" id="nav-texte-popover" popover>
              <a href="#">Lettres</a>
              <a href="#">Transcription intégrale</a>
            </div>
          </li>
          <li>
            <button
              id="btn-references-popover"
              class="btn-menu"
              popovertarget="nav-references-popover"
            >
              Références<i class="fa-solid fa-chevron-up"></i>
            </button>
            <div class="popover" id="nav-references-popover" popover>
              <a href="#">Ressources</a>
              <a href="#">Documentation historique</a>
              <a href="#">Données</a>
              <a href="#">Index</a>
            </div>
          </li>
          <li>
            <button
              id="btn-apropos-popover"
              class="btn-menu"
              popovertarget="nav-apropos-popover"
            >
              À propos<i class="fa-solid fa-chevron-up"></i>
            </button>
            <div class="popover" id="nav-apropos-popover" popover>
              <a href="#">Présentation du projet</a>
              <a href="#">Introduction générale</a>
              <a href="#">Choix éditoriaux</a>
              <a href="#">Contributeurs</a>
            </div>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="main-container">
        <div class="main-header">
          <div class="mh-left">
            <a class="work-letter-button" href=""><</a>
            <a class="letter-button" href="">< Lettre précédente</a>
          </div>
          <div class="mh-middle">
            <select id="choix-lettre"></select>
          </div>
          <div class="mh-right">
            <a class="letter-button" href="">Lettre suivante ></a>
            <a class="work-letter-button" href="">></a>
          </div>
        </div>
        <div class="main-body">
          <div class="main-body-ressources">
            <div class="ressources-header">
              <select id="choix-ressources">
                <option value="manuscrit">Manuscrit</option>
                <option value="emprunts">Emprunts</option>
                <option value="mentions">Mentions</option>
                <option value="cartographie">Cartographie</option>
              </select>
            </div>
            <div class="ressources-body">
              <img id="image-manuscrit" src="" alt="" />
            </div>
          </div>
          <div id="splitter"></div>
          <div class="main-body-text">
            <div class="text-header">
              <input
                type="checkbox"
                id="checkbox-note-visibility"
                name="checkbox-note-visibility"
                value="Affiche l'appareil critique"
              />
              <label for="checkbox-note-visibility"
                >Afficher l'appareil critique</label
              >
            </div>
            <div class="text-body">
              <div id="texte-normalise"></div>
            </div>
            <div class="text-footer">
              <div id="btn-pages">
                <button id="btn-page-pre" href=""><</button>
                <button id="btn-page-fol" href="">></button>
              </div>
              <span id="page-number">
                Page <span id="numero-page-active" aria-live="polite"></span>/6
              </span>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>Footer</footer>
    <script src="../../js/viewer.js"></script>
  </body>
</html>
